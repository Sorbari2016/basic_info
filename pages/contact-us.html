<!doctype html>
<html lang="en">
  <head>
    <title>Contact Us</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <h1>NaijaTunes</h1>
        </div>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/about">About Us</a></li>
          <li><a href="/contact-us" class="active">Contact Us</a></li>
        </ul>
      </nav>
    </header>

    <section class="page-hero">
      <div class="hero-content">
        <h2>Get In Touch</h2>
        <p>We'd love to hear from you</p>
      </div>
    </section>

    <div class="container">
      <h3 class="section-title">Contact Us</h3>

      <div class="contact-form-container">
        <form class="contact-form">
          <input type="text" id="fullName" placeholder="Your Name" required />
          <input type="email" id="email" placeholder="Your Email" required />
          <input type="text" id="subject" placeholder="Subject" required />
          <textarea
            id="message"
            placeholder="Your Message"
            rows="8"
            required
          ></textarea>
          <button type="submit" class="btn">Send Message</button>
        </form>
      </div>

      <div class="contact-info">
        <p><strong>Email:</strong> hello@naijatunes.com</p>
        <p><strong>Follow us:</strong> Instagram • Twitter • YouTube</p>
      </div>
    </div>

    <footer>
      <p>&copy; 2026 NaijaTunes • Celebrating Nigerian Music</p>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/about">About Us</a>
        <a href="/contact-us">Contact Us</a>
      </div>
    </footer>
  </body>
</html>
